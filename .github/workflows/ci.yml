name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise refuses env and tasks from an untrusted mise.toml.
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  ci:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # criteria owns machine-checkable gates. Manual interface review lives
        # in .agents/skills/review-upgrade-usability and is never run by CI.
        task: [criteria, integration-gnodev]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gno-toolchains
          key: ${{ runner.os }}-gno-${{ hashFiles('mise.toml') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.task }}-${{ hashFiles('mise.toml', 'integration/go.sum') }}
      - run: mise run setup
      - run: mise run ${{ matrix.task }}
