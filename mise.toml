[tools]
go = "1.25"
gofumpt = "0.12.0"

[env]
# gno release to build the toolchain from. Match it to the target chain (chain/mainnet = v1.2.0).
GNO_REF = "v1.6.0"
GNO_TOOLCHAIN = "{{env.HOME}}/.cache/gno-toolchains/{{env.GNO_REF}}"
# the toolchain lives outside the repo so `gno test ./...` does not pick up its sources
GNOROOT = "{{env.GNO_TOOLCHAIN}}/src"
_.path = ["{{env.GNO_TOOLCHAIN}}/bin"]

[tasks.setup]
description = "Build gno, gnokey, and gnodev at GNO_REF"
run = '''
set -e
[ -d "$GNOROOT" ] || git clone -q --depth 1 --branch "$GNO_REF" https://github.com/gnolang/gno "$GNOROOT"
cd "$GNOROOT"
GOBIN="$GNO_TOOLCHAIN/bin" go install ./gnovm/cmd/gno ./gno.land/cmd/gnokey
cd contribs/gnodev && GOBIN="$GNO_TOOLCHAIN/bin" go install .
# test deps come from this release's examples, not the shared cache filled from rpc.gno.land
mod="$GNO_TOOLCHAIN/gnohome/pkg/mod"
mkdir -p "$mod"
rm -rf "$mod/gno.land" "$mod/.markers" && cp -R "$GNOROOT/examples/gno.land" "$mod/"
# gno re-downloads any package without a .markers/<pkg address> file, so mark every copied package
cat > "$GNO_TOOLCHAIN/markers.go" <<'EOF'
package main

import (
	"io/fs"
	"os"
	"path/filepath"

	"github.com/gnolang/gno/gnovm/pkg/gnolang"
)

func main() {
	mod := os.Args[1]
	os.MkdirAll(filepath.Join(mod, ".markers"), 0o755)
	filepath.WalkDir(filepath.Join(mod, "gno.land"), func(p string, d fs.DirEntry, err error) error {
		if err != nil || d.Name() != "gnomod.toml" {
			return err
		}
		pkg, _ := filepath.Rel(mod, filepath.Dir(p))
		addr := gnolang.DerivePkgBech32Addr(filepath.ToSlash(pkg)).String()
		return os.WriteFile(filepath.Join(mod, ".markers", addr), nil, 0o644)
	})
}
EOF
cd "$GNOROOT" && go run "$GNO_TOOLCHAIN/markers.go" "$mod"
'''

[tasks.test]
env = { GNOHOME = "{{env.GNO_TOOLCHAIN}}/gnohome" }
run = "gno test -v ./src/..."

[tasks.lint]
env = { GNOHOME = "{{env.GNO_TOOLCHAIN}}/gnohome" }
run = "gno lint ./src/..."

[tasks.fmt]
run = "find src -name '*.gno' -exec gofumpt -w -l {} +"

[tasks.dev]
description = "Local devnet with this repo's packages loaded"
run = "gnodev ./src/p/upgrade/v0"
