[tools]
go = "1.25"
gofumpt = "0.12.0"

[env]
# gno release to build the toolchain from. Match it to the target chain.
GNO_REF = "v1.5.1"
GNO_TOOLCHAIN = "{{env.HOME}}/.cache/gno-toolchains/{{env.GNO_REF}}"
# the toolchain lives outside the repo so `gno test ./...` does not pick up its sources
GNOROOT = "{{env.GNO_TOOLCHAIN}}/src"
_.path = ["{{env.GNO_TOOLCHAIN}}/bin"]
# outside the repo, so the workspace never sees a second copy of each package
DEVNET_DIR = "{{env.GNO_TOOLCHAIN}}/devnet"

[tasks.setup]
description = "Build gno, gnokey, and gnodev at GNO_REF"
run = '''
set -e
[ -d "$GNOROOT" ] || git clone -q --depth 1 --branch "$GNO_REF" https://github.com/gnolang/gno "$GNOROOT"
cd "$GNOROOT"
GOBIN="$GNO_TOOLCHAIN/bin" go install ./gnovm/cmd/gno ./gno.land/cmd/gnokey
cd contribs/gnodev && GOBIN="$GNO_TOOLCHAIN/bin" go install .
# test deps come from this release's examples, not the shared cache filled from rpc.gno.land
mod="$GNO_TOOLCHAIN/gnohome/pkg/mod"
mkdir -p "$mod"
rm -rf "$mod/gno.land" "$mod/.markers" && cp -R "$GNOROOT/examples/gno.land" "$mod/"
# gno re-downloads any package without a .markers/<pkg address> file, so mark every copied package
cat > "$GNO_TOOLCHAIN/markers.go" <<'EOF'
package main

import (
	"io/fs"
	"os"
	"path/filepath"

	"github.com/gnolang/gno/gnovm/pkg/gnolang"
)

func main() {
	mod := os.Args[1]
	os.MkdirAll(filepath.Join(mod, ".markers"), 0o755)
	filepath.WalkDir(filepath.Join(mod, "gno.land"), func(p string, d fs.DirEntry, err error) error {
		if err != nil || d.Name() != "gnomod.toml" {
			return err
		}
		pkg, _ := filepath.Rel(mod, filepath.Dir(p))
		addr := gnolang.DerivePkgBech32Addr(filepath.ToSlash(pkg)).String()
		return os.WriteFile(filepath.Join(mod, ".markers", addr), nil, 0o644)
	})
}
EOF
cd "$GNOROOT" && go run "$GNO_TOOLCHAIN/markers.go" "$mod"
'''

[tasks.test]
env = { GNOHOME = "{{env.GNO_TOOLCHAIN}}/gnohome" }
run = "gno test -v ./src/..."

[tasks.lint]
env = { GNOHOME = "{{env.GNO_TOOLCHAIN}}/gnohome" }
run = "gno lint ./src/..."

[tasks.criteria]
description = "Run automated usability and safety criteria"
depends = ["lint", "test", "integration"]

[tasks.fmt]
run = "find src -name '*.gno' -exec gofumpt -w -l {} +"

[tasks.dev]
description = "Local gnodev chain with src deployed, except vault/v2 so it can be deployed by hand"
run = '''
set -e
# gnodev runs on a copy: vault/v2 is left out, and UpgradeDelay is cut from a day to 5 blocks
# because a real chain cannot skip heights the way filetests do.
rm -rf "$DEVNET_DIR" && mkdir -p "$DEVNET_DIR"
cp -R src "$DEVNET_DIR/" && touch "$DEVNET_DIR/gnowork.toml"
rm -rf "$DEVNET_DIR/src/r/upgrade/vault/v2"
f="$DEVNET_DIR/src/r/upgrade/vault/vault.gno"
grep -q '^const UpgradeDelay = ' "$f" || { echo "UpgradeDelay not found in $f" >&2; exit 1; }
perl -pi -e 's/^const UpgradeDelay = .*/const UpgradeDelay = 5/' "$f"
exec gnodev local -C "$DEVNET_DIR" -empty-blocks -paths gno.land/r/upgrade/vault,gno.land/r/upgrade/vault/v1
'''

[tasks.integration]
description = "Run integration/testdata/*.txtar against an in-memory gno.land node"
dir = "integration"
run = "go test ./..."

[tasks.integration-gnodev]
description = "Run the CI deployment smoke test against gnodev"
run = "./integration/gnodev.sh"
